name: Go quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', '1.27.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -race ./...
      - run: go vet ./...

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89 # v1.1.3
        with:
          version: v1.1.3
          go_version_file: .github/go-version
          race: 'true'
          coverage_threshold: '100'
          package_threshold: '100'
          commit: 'false'
      - uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d # v1.1.7
        with:
          version: "v1.1.7"
          go_version_file: .github/go-version
          commit: 'false'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-quality-reports
          include-hidden-files: true
          path: |
            .github/coverage.svg
            .github/go-test-report.md
            .github/go-test-report.json
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/

  publish:
    needs: [check, compatibility]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-quality-reports
          path: .github
      - name: Commit reports for the tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main has changed; leaving reports as workflow artifacts."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/coverage.svg .github/go-test-report.md .github/go-test-report.json .github/goreportcard.svg .github/goreportcard-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Go quality reports [skip ci]'
            git push origin HEAD:main
          fi
